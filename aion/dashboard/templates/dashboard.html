<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AION Dashboard</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root[data-theme="dark"] {
  --bg:        #0f1117;
  --sidebar:   #13161f;
  --card:      #1a1d27;
  --border:    #2a2d3e;
  --text:      #e0e0e0;
  --text-dim:  #888;
  --accent:    #1e90ff;
  --accent2:   #7B2FBE;
  --green:     #4caf50;
  --orange:    #ff9800;
  --red:       #f44336;
  --header:    #151821;
}
:root[data-theme="light"] {
  --bg:        #f0f2f5;
  --sidebar:   #ffffff;
  --card:      #ffffff;
  --border:    #dde1f0;
  --text:      #1a1a2e;
  --text-dim:  #666;
  --accent:    #1e90ff;
  --accent2:   #7B2FBE;
  --green:     #2e7d32;
  --orange:    #e65100;
  --red:       #c62828;
  --header:    #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── Header ── */
header {
  background: var(--header);
  border-bottom: 2px solid var(--accent);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  z-index: 100;
}
header h1 { font-size: 1.2rem; color: var(--accent); font-weight: 700; }
header .version { color: var(--text-dim); font-size: 0.8rem; }
header .spacer { flex: 1; }
.header-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: background 0.2s;
}
.header-btn:hover { background: var(--accent); color: white; }
.notif-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 4px; }

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 12px 0;
}
.sidebar-title {
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 16px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s;
  user-select: none;
  border-left: 3px solid transparent;
  font-size: 0.9rem;
}
.nav-item:hover { background: var(--border); }
.nav-item.active {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.nav-icon { font-size: 1.1rem; width: 22px; text-align: center; }
.drag-handle {
  margin-left: auto;
  color: var(--text-dim);
  cursor: grab;
  font-size: 0.8rem;
  opacity: 0.4;
}
.drag-handle:hover { opacity: 1; }
.nav-item.sortable-ghost { opacity: 0.3; }
.nav-item.sortable-drag { background: var(--accent); color: white; border-radius: 6px; }

/* ── Main content ── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: var(--bg);
}

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 1rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .refresh-btn {
  margin-left: auto;
  background: var(--border);
  border: none;
  color: var(--text-dim);
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.75rem;
}
.card-title .refresh-btn:hover { background: var(--accent); color: white; }

/* ── Stat rows ── */
.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
}
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--text-dim); }
.stat-value { font-weight: 500; }

/* ── Badges ── */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-green  { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.badge-red    { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
.badge-blue   { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.badge-orange { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }

/* ── Service list ── */
.svc-list { list-style: none; }
.svc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--border) 40%, transparent);
  margin-bottom: 6px;
  font-size: 0.85rem;
}
.svc-name { color: var(--accent); font-weight: 600; min-width: 140px; }
.svc-desc { color: var(--text-dim); font-size: 0.8rem; flex: 1; }
.domain-badge {
  font-size: 0.7rem;
  background: var(--accent2);
  color: white;
  padding: 1px 7px;
  border-radius: 10px;
}
.run-btn {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent);
  padding: 3px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.78rem;
  white-space: nowrap;
  transition: background 0.15s;
}
.run-btn:hover { background: var(--accent); color: white; }
.cmd-result {
  font-size: 0.82rem;
  color: var(--green);
  background: color-mix(in srgb, var(--green) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--green) 25%, transparent);
  border-radius: 4px;
  padding: 8px 12px;
  margin-top: 4px;
  white-space: pre-wrap;
  word-break: break-all;
}
.alert-success { color: var(--green); padding: 6px; font-size: 0.85rem; }
.alert-error   { color: var(--red);   padding: 6px; font-size: 0.85rem; }

/* ── Console ── */
.console-wrap {
  background: #0a0c14;
  border-radius: 8px;
  padding: 16px;
  font-family: "Cascadia Code", "Consolas", monospace;
  font-size: 0.85rem;
  min-height: 300px;
  max-height: 500px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.console-history { flex: 1; margin-bottom: 12px; }
.console-line { color: #888; margin-top: 10px; }
.console-prompt { color: var(--accent); font-weight: bold; margin-right: 6px; }
.console-cmd { color: #fff; }
.console-output {
  color: var(--green);
  white-space: pre-wrap;
  padding-left: 20px;
  margin-top: 2px;
  font-size: 0.82rem;
}
.console-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid #222;
  padding-top: 12px;
}
.console-prompt-label { color: var(--accent); font-weight: bold; white-space: nowrap; }
.console-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
}
.console-send-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 4px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
}
.console-send-btn:hover { opacity: 0.85; }

/* ── QuickMind ── */
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--border) 40%, transparent);
  margin-bottom: 5px;
  font-size: 0.85rem;
}
.task-title { flex: 1; }
.task-prio-urgent { color: var(--red); }
.task-prio-high   { color: var(--orange); }
.task-prio-normal { color: var(--accent); }
.task-prio-low    { color: var(--text-dim); }
.qm-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.qm-input {
  flex: 1;
  min-width: 180px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
}
.qm-select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 0.85rem;
}
.qm-submit {
  background: var(--green);
  color: white;
  border: none;
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
}
.qm-submit:hover { opacity: 0.85; }
.offline-msg { color: var(--red); font-size: 0.85rem; padding: 16px; text-align: center; }

/* ── Scheduler form ── */
.sched-form { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sched-input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.82rem;
}
.sched-submit {
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
}

/* ── Job list ── */
.job-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--border) 40%, transparent);
  margin-bottom: 6px;
  font-size: 0.85rem;
}
.job-id { color: var(--orange); font-weight: 600; flex: 1; }
.job-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 2px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.75rem;
}
.job-btn:hover { background: var(--border); color: var(--text); }

/* ── Memory ── */
.mem-item {
  display: flex;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--border) 40%, transparent);
  margin-bottom: 4px;
  font-size: 0.83rem;
  align-items: center;
}
.mem-key { color: var(--accent); font-weight: 600; min-width: 120px; }
.mem-val { color: var(--text); flex: 1; }
.mem-type { font-size: 0.7rem; background: var(--border); padding: 1px 6px; border-radius: 8px; color: var(--text-dim); }

/* ── Grid stats ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-box {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.stat-box .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.stat-box .lbl { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

/* ── Domain group ── */
.domain-group { margin-bottom: 16px; }
.domain-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 6px;
  padding-left: 4px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── HTMX loading ── */
.htmx-indicator { display: none; }
.htmx-request .htmx-indicator { display: inline; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <span style="font-size:1.4rem;">🤖</span>
  <h1>AION</h1>
  <span class="version">v{{ version }}</span>
  <div class="spacer"></div>
  <button class="header-btn" onclick="toggleTheme()">🌓 Thème</button>
  <a href="/docs" target="_blank" style="text-decoration:none;">
    <button class="header-btn">📖 API</button>
  </a>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-title">Navigation</div>
    <ul id="nav-list" style="list-style:none; padding:0;">
      <li class="nav-item active" data-section="status" onclick="loadSection(this)">
        <span class="nav-icon">📊</span> Status
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="quickmind" onclick="loadSection(this)">
        <span class="nav-icon">✅</span> QuickMind
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="services" onclick="loadSection(this)">
        <span class="nav-icon">⚡</span> Services
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="scheduler" onclick="loadSection(this)">
        <span class="nav-icon">⏱</span> Scheduler
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="memory" onclick="loadSection(this)">
        <span class="nav-icon">🧠</span> Memory
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="fs_search" onclick="loadSection(this)">
        <span class="nav-icon">🔍</span> Fichiers
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="ado" onclick="loadSection(this)">
        <span class="nav-icon">🔵</span> Azure DevOps
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="network" onclick="loadSection(this)">
        <span class="nav-icon">🌐</span> Network
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="system" onclick="loadSection(this)">
        <span class="nav-icon">🖥️</span> System
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="docker" onclick="loadSection(this)">
        <span class="nav-icon">🐳</span> Docker
        <span class="drag-handle">⠿</span>
      </li>
      <li class="nav-item" data-section="console" onclick="loadSection(this)">
        <span class="nav-icon">💬</span> Console
        <span class="drag-handle">⠿</span>
      </li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main" id="main-content">
    <!-- Chargé dynamiquement -->
    <div hx-get="/section/status" hx-trigger="load" hx-swap="innerHTML"></div>
  </main>

</div>

<script>
// ── Navigation ────────────────────────────────────────────────────────────────
function loadSection(el) {
  document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
  const section = el.dataset.section;
  const main = document.getElementById("main-content");
  main.innerHTML = '<div style="color:var(--text-dim); padding:40px; text-align:center;">Chargement...</div>';
  fetch(`/section/${section}`)
    .then(r => r.text())
    .then(html => { main.innerHTML = html; htmx.process(main); });
}

// ── Drag & Drop sidebar (SortableJS + localStorage) ───────────────────────────
const navList = document.getElementById("nav-list");
const STORAGE_KEY = "aion_sidebar_order";

function saveSidebarOrder() {
  const order = [...navList.querySelectorAll(".nav-item")]
    .map(el => el.dataset.section);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
}

function restoreSidebarOrder() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  const order = JSON.parse(saved);
  order.forEach(section => {
    const el = navList.querySelector(`[data-section="${section}"]`);
    if (el) navList.appendChild(el);
  });
}

Sortable.create(navList, {
  animation: 150,
  handle: ".drag-handle",
  ghostClass: "sortable-ghost",
  dragClass: "sortable-drag",
  onEnd: saveSidebarOrder,
});

restoreSidebarOrder();

// ── Thème dark/light ──────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  localStorage.setItem("aion_theme", next);
}

const savedTheme = localStorage.getItem("aion_theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

// ── Console : historique + Tab autocompletion ─────────────────────────────────
window.consoleHistory = [];
window.historyIndex = -1;

function consoleKeyDown(e, services) {
  const input = e.target;
  if (e.key === "Enter") {
    e.preventDefault();
    submitConsole(input);
    return;
  }
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (window.historyIndex < window.consoleHistory.length - 1) {
      window.historyIndex++;
      input.value = window.consoleHistory[window.consoleHistory.length - 1 - window.historyIndex];
    }
    return;
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (window.historyIndex > 0) {
      window.historyIndex--;
      input.value = window.consoleHistory[window.consoleHistory.length - 1 - window.historyIndex];
    } else {
      window.historyIndex = -1;
      input.value = "";
    }
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const val = input.value;
    if (val.startsWith("run ")) {
      const partial = val.slice(4);
      const match = services.find(s => s.startsWith(partial));
      if (match) input.value = "run " + match;
    }
    return;
  }
}

function submitConsole(input) {
  const cmd = input.value.trim();
  if (!cmd) return;
  window.consoleHistory.push(cmd);
  window.historyIndex = -1;

  const formData = new FormData();
  formData.append("command", cmd);
  input.value = "";

  fetch("/console/run", { method: "POST", body: formData })
    .then(r => r.text())
    .then(html => {
      const history = document.getElementById("console-history");
      if (history) {
        history.insertAdjacentHTML("beforeend", html);
        history.scrollTop = history.scrollHeight;
      }
    });
}
</script>

</body>
</html>
