<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            background: #1a1d27;
            border-bottom: 2px solid #1e90ff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header h1 { font-size: 1.6rem; color: #1e90ff; }
        header span { color: #888; font-size: 0.9rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            padding: 24px 32px;
        }
        .card {
            background: #1a1d27;
            border: 1px solid #2a2d3e;
            border-radius: 10px;
            padding: 20px;
        }
        .card h2 {
            font-size: 1rem;
            color: #1e90ff;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 .refresh-btn {
            margin-left: auto;
            font-size: 0.75rem;
            background: #2a2d3e;
            border: none;
            color: #888;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .card h2 .refresh-btn:hover { background: #1e90ff; color: white; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #2a2d3e;
            font-size: 0.9rem;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #888; }
        .stat-value { color: #fff; font-weight: 500; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge-green { background: #1a3a2a; color: #4caf50; }
        .badge-red   { background: #3a1a1a; color: #f44336; }
        .badge-blue  { background: #1a2a3a; color: #1e90ff; }
        .badge-orange{ background: #3a2a1a; color: #ff9800; }
        .service-list, .job-list, .memory-list {
            list-style: none;
            margin-top: 4px;
        }
        .service-list li, .job-list li, .memory-list li {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 6px;
            background: #12141f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .service-name { color: #1e90ff; font-weight: 600; }
        .service-desc { color: #888; font-size: 0.8rem; }
        .run-btn {
            background: #1e90ff22;
            border: 1px solid #1e90ff55;
            color: #1e90ff;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            white-space: nowrap;
        }
        .run-btn:hover { background: #1e90ff; color: white; }
        .run-result {
            font-size: 0.78rem;
            color: #4caf50;
            padding: 4px 10px;
            margin-top: 4px;
            background: #1a3a2a;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .job-id { color: #ff9800; font-weight: 600; font-size: 0.82rem; }
        .memory-key { color: #1e90ff; font-size: 0.82rem; font-weight: 600; }
        .memory-val { color: #ccc; font-size: 0.82rem; }
        .auto-refresh { color: #555; font-size: 0.75rem; margin-top: 8px; text-align: right; }
        footer {
            text-align: center;
            padding: 16px;
            color: #333;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🤖 AION</h1>
    <span>AI Agent Orchestrator Node &nbsp;|&nbsp; v{{ version }}</span>
</header>

<div class="grid">

    <!-- Statut general -->
    <div class="card"
         hx-get="/dashboard/status"
         hx-trigger="every 10s"
         hx-swap="innerHTML">
        {% include "fragments/status.html" %}
    </div>

    <!-- Services -->
    <div class="card"
         hx-get="/dashboard/services"
         hx-trigger="every 30s"
         hx-swap="innerHTML">
        {% include "fragments/services.html" %}
    </div>

    <!-- Scheduler -->
    <div class="card"
         hx-get="/dashboard/scheduler"
         hx-trigger="every 10s"
         hx-swap="innerHTML">
        {% include "fragments/scheduler.html" %}
    </div>

    <!-- Memoire -->
    <div class="card"
         hx-get="/dashboard/memory"
         hx-trigger="every 15s"
         hx-swap="innerHTML">
        {% include "fragments/memory.html" %}
    </div>

</div>

<footer>AION Dashboard &mdash; rafraichissement automatique toutes les 10s</footer>

</body>
</html>
