<div class="card">
  <div class="card-title">&#x23F0; Timer — Compte a rebours</div>

  <!-- Formulaire principal -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;">

    <!-- Durée rapide -->
    <div>
      <div style="color:var(--text-dim);font-size:0.75rem;margin-bottom:4px;">Duree rapide</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="run-btn" onclick="timerSetDuration('5m')">5m</button>
        <button class="run-btn" onclick="timerSetDuration('10m')">10m</button>
        <button class="run-btn" onclick="timerSetDuration('15m')">15m</button>
        <button class="run-btn" onclick="timerSetDuration('25m')">25m &#x1F345;</button>
        <button class="run-btn" onclick="timerSetDuration('30m')">30m</button>
        <button class="run-btn" onclick="timerSetDuration('1h')">1h</button>
      </div>
    </div>

    <!-- Durée personnalisée -->
    <div style="flex:1;min-width:120px;">
      <div style="color:var(--text-dim);font-size:0.75rem;margin-bottom:4px;">Duree (5m, 1h30m, 90s...)</div>
      <input
        class="qm-input"
        id="timer-duration"
        type="text"
        placeholder="ex: 25m"
        style="width:100%;"
        onkeydown="if(event.key==='Enter') timerStart()"
      >
    </div>

    <!-- Message -->
    <div style="flex:2;min-width:180px;">
      <div style="color:var(--text-dim);font-size:0.75rem;margin-bottom:4px;">Message de fin</div>
      <input
        class="qm-input"
        id="timer-message"
        type="text"
        placeholder="ex: Pause cafe !"
        style="width:100%;"
        onkeydown="if(event.key==='Enter') timerStart()"
      >
    </div>

    <!-- Bips -->
    <div style="min-width:80px;">
      <div style="color:var(--text-dim);font-size:0.75rem;margin-bottom:4px;">Bips</div>
      <select class="qm-select" id="timer-beeps" style="width:100%;">
        <option value="0">0 (off)</option>
        <option value="1">1</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
      </select>
    </div>

    <!-- Bouton -->
    <button
      class="qm-submit"
      style="background:var(--accent);height:38px;padding:0 20px;"
      onclick="timerStart()">
      &#x25B6; Demarrer
    </button>
  </div>

  <!-- Feedback -->
  <div id="timer-feedback"></div>

  <!-- Timers actifs -->
  <div id="timer-active" style="margin-top:12px;"></div>
</div>

<!-- Styles -->
<style>
.timer-card{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:8px;
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
  margin-bottom:8px;
}
.timer-countdown{
  font-size:1.6rem;font-weight:700;color:var(--accent);
  font-family:"Cascadia Code",Consolas,monospace;min-width:80px;
}
.timer-countdown.urgent{color:var(--red);}
.timer-msg{flex:1;font-size:0.9rem;}
.timer-id{color:var(--text-dim);font-size:0.75rem;}
.timer-cancel-btn{
  background:color-mix(in srgb,var(--red) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
  color:var(--red);padding:3px 10px;border-radius:4px;
  cursor:pointer;font-size:0.78rem;
}
.timer-cancel-btn:hover{background:var(--red);color:white;}
.timer-done{
  padding:12px 16px;border-radius:8px;
  background:color-mix(in srgb,var(--green) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--green) 30%,transparent);
  color:var(--green);font-weight:600;margin-bottom:8px;
  animation:fadeOut 3s forwards;animation-delay:5s;
}
@keyframes fadeOut{from{opacity:1}to{opacity:0;height:0;padding:0;margin:0;}}
</style>

<script>
// Timers actifs cote navigateur (pour le decompte visuel)
window._timerIntervals = window._timerIntervals || {};

function timerSetDuration(val) {
  document.getElementById("timer-duration").value = val;
  document.getElementById("timer-message").focus();
}

function timerStart() {
  var duration = (document.getElementById("timer-duration") || {}).value || "";
  var message  = (document.getElementById("timer-message")  || {}).value || "Temps ecoule !";
  var beeps    = (document.getElementById("timer-beeps")    || {}).value || "3";
  var feedback = document.getElementById("timer-feedback");

  duration = duration.trim();
  if (!duration) {
    if (feedback) feedback.innerHTML =
      '<div style="color:var(--red);padding:6px;">Veuillez entrer une duree.</div>';
    return;
  }

  // Appel console API
  var formData = new FormData();
  formData.append("command",
    "timer " + duration +
    (message && message !== "Temps ecoule !" ? " " + message : "") +
    (beeps !== "3" ? " --beeps " + beeps : "")
  );

  fetch("/console/run", { method: "POST", body: formData })
    .then(function(r) { return r.text(); })
    .then(function(html) {
      // Extraire le timer_id de la reponse
      var match = html.match(/timer_(\d+)/);
      if (match) {
        var timerId  = match[0];
        var seconds  = timerParseDuration(duration);
        if (seconds > 0) {
          timerAddCard(timerId, seconds, message || "Temps ecoule !");
        }
      }
      if (feedback) feedback.innerHTML =
        '<div style="color:var(--green);padding:6px;">&#x23F0; Timer demarre !</div>';
      setTimeout(function() {
        if (feedback) feedback.innerHTML = "";
      }, 3000);
      // Reset
      document.getElementById("timer-duration").value = "";
      document.getElementById("timer-message").value  = "";
    })
    .catch(function(err) {
      if (feedback) feedback.innerHTML =
        '<div style="color:var(--red);">Erreur: ' + err + '</div>';
    });
}

function timerParseDuration(raw) {
  raw = raw.trim().toLowerCase();
  var total = 0;
  // Format mm:ss
  if (raw.indexOf(":") !== -1) {
    var parts = raw.split(":");
    if (parts.length === 2) return parseInt(parts[0])*60 + parseInt(parts[1]);
    if (parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseInt(parts[2]);
    return 0;
  }
  // Format avec unites
  var matches = raw.match(/(\d+)([hms]?)/g) || [];
  matches.forEach(function(m) {
    var num  = parseInt(m);
    var unit = m.slice(-1);
    if      (unit === "h") total += num * 3600;
    else if (unit === "m") total += num * 60;
    else                   total += num;
  });
  return total || parseInt(raw) || 0;
}

function timerFmtSeconds(s) {
  if (s <= 0) return "00:00";
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var sec = s % 60;
  if (h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

function timerAddCard(timerId, seconds, message) {
  var container = document.getElementById("timer-active");
  if (!container) return;

  var card = document.createElement("div");
  card.className = "timer-card";
  card.id = "timercard-" + timerId;
  card.innerHTML =
    '<span class="timer-countdown" id="timercount-' + timerId + '">' + timerFmtSeconds(seconds) + '</span>' +
    '<div style="flex:1">' +
      '<div class="timer-msg">&#x1F4AC; ' + message + '</div>' +
      '<div class="timer-id">ID: ' + timerId + '</div>' +
    '</div>' +
    '<button class="timer-cancel-btn" onclick="timerCancel(\'' + timerId + '\')">' +
      '&#x2716; Annuler</button>';
  container.insertBefore(card, container.firstChild);

  // Decompte visuel
  var remaining = seconds;
  var interval = setInterval(function() {
    remaining--;
    var el = document.getElementById("timercount-" + timerId);
    if (el) {
      el.textContent = timerFmtSeconds(remaining);
      if (remaining <= 10) el.classList.add("urgent");
    }
    if (remaining <= 0) {
      clearInterval(interval);
      delete window._timerIntervals[timerId];
      var cardEl = document.getElementById("timercard-" + timerId);
      if (cardEl) {
        cardEl.className = "timer-done";
        cardEl.innerHTML =
          '&#x23F0; Timer termine ! ' + message +
          ' <span style="font-size:0.8rem;margin-left:8px;opacity:0.7;">(disparait dans 8s)</span>';
      }
    }
  }, 1000);
  window._timerIntervals[timerId] = interval;
}

function timerCancel(timerId) {
  // Arreter l intervalle local
  if (window._timerIntervals[timerId]) {
    clearInterval(window._timerIntervals[timerId]);
    delete window._timerIntervals[timerId];
  }
  // Supprimer la carte
  var card = document.getElementById("timercard-" + timerId);
  if (card) card.remove();
  // Annuler cote serveur
  var formData = new FormData();
  formData.append("command", "timer cancel " + timerId);
  fetch("/console/run", { method: "POST", body: formData });
}
</script>
