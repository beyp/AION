<div class="card" style="padding:0; overflow:hidden;">
  <div class="card-title" style="padding:16px 20px 12px; border-bottom:1px solid var(--border);">
    &#x1F4AC; Console AION
    <button class="refresh-btn" onclick="document.getElementById('console-history').innerHTML=''">
      &#x1F5D1; Clear
    </button>
  </div>
  <div class="console-wrap">
    <div class="console-history" id="console-history">
      <div class="console-output" style="color:var(--text-dim);">
AION Console v0.7.2
  Tab / fleches = intellisense | haut/bas = historique | Echap = fermer suggestions
  Ex: ado get item 191614 | ado list --state "In Progress" | qm add "Titre" --priority urgent
      </div>
    </div>
    <div class="console-input-row">
      <!-- Intellisense box au-dessus de l input -->
      <div id="intellisense-box" class="intellisense-box"></div>
      <span class="console-prompt-label">AION&gt;</span>
      <input
        class="console-input"
        id="console-input"
        type="text"
        placeholder="ado list | net status | qm add Titre | fs search mot | sys disk | help..."
        autofocus
        autocomplete="off"
        onkeydown="consoleKeyDown(event)"
        oninput="showIntellisense(this.value)"
        onfocus="showIntellisense(this.value)"
        onblur="setTimeout(()=>document.getElementById('intellisense-box').style.display='none', 200)"
      >
      <button class="console-send-btn"
        onclick="submitConsole(document.getElementById('console-input'))">
        &#x21B5;
      </button>
    </div>
  </div>
</div>

<!-- Raccourcis rapides -->
<div class="card" style="margin-top:16px;">
  <div class="card-title">&#x26A1; Raccourcis rapides</div>

  <div style="margin-bottom:10px;">

    <span style="color:var(--text-dim);font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;">CORE</span>

      <button class="run-btn" onclick="submitFromBtn('status')">status</button>
      <button class="run-btn" onclick="submitFromBtn('services')">services</button>
      <button class="run-btn" onclick="submitFromBtn('shortcuts')">shortcuts</button>
      <button class="run-btn" onclick="submitFromBtn('domains')">domains</button>

      <button class="run-btn" onclick="submitFromBtn('memory')">memory</button>
    </div>
  </div>
</div>

<script>
// submitFromBtn : fonctionne meme si window.quickCmd pas encore defini
// car on fait tout en local ici
function submitFromBtn(cmd) {
  // 1. Mettre la commande dans l input si present
  const input = document.getElementById("console-input");

  // 2. Envoyer directement via fetch (pas besoin de submitConsole)
  const formData = new FormData();
  formData.append("command", cmd);

  if (input) input.value = "";

  fetch("/console/run", { method: "POST", body: formData })
    .then(r => r.text())
    .then(html => {
      const history = document.getElementById("console-history");
      if (history) {
        history.insertAdjacentHTML("beforeend", html);
        history.scrollTop = history.scrollHeight;
      }
    })
    .catch(err => console.error("AION console error:", err));
}
</script>
