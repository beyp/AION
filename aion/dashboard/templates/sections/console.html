<div class="card" style="padding:0; overflow:hidden;">
  <div class="card-title" style="padding:16px 20px 12px; border-bottom:1px solid var(--border);">
    &#x1F4AC; Console AION
    <button class="refresh-btn" onclick="document.getElementById('console-history').innerHTML=''">
      &#x1F5D1; Clear
    </button>
  </div>
  <div class="console-wrap">
    <div class="console-history" id="console-history">
      <div class="console-output" style="color:var(--text-dim);">
AION Console v0.7.2
  Tab / fleches = intellisense | haut/bas = historique | Echap = fermer suggestions
  Ex: ado get item 191614 | ado list --state "In Progress" | qm add "Titre" --priority urgent
      </div>
    </div>
    <div class="console-input-row">
      <div id="intellisense-box" class="intellisense-box"></div>
      <span class="console-prompt-label">AION&gt;</span>
      <input
        class="console-input"
        id="console-input"
        type="text"
        placeholder="ado list | net status | qm add Titre | fs search mot | sys disk | help..."
        autofocus
        autocomplete="off"
        onkeydown="window.consoleKeyDown(event)"
        oninput="window.showIntellisense(this.value)"
        onfocus="window.showIntellisense(this.value)"
        onblur="setTimeout(()=>{var b=document.getElementById('intellisense-box');if(b)b.style.display='none'},200)"
      >
      <button class="console-send-btn"
        onclick="window.submitConsole(document.getElementById('console-input'))">
        &#x21B5;
      </button>
    </div>
  </div>
</div>

<!-- Raccourcis rapides — inline onclick pour eviter le probleme de script dans innerHTML -->
<div class="card" style="margin-top:16px;">
  <div class="card-title">&#x26A1; Raccourcis rapides</div>

  <div style="margin-bottom:10px;">

      <button class="run-btn" onclick="window.submitConsole('ado list')">ado list</button>
