<div class="card">
  <div class="card-title">&#x1F50D; Recherche Fichiers</div>

  <div style="margin-bottom:16px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <input
        class="qm-input"
        id="fs-keywords"
        type="text"
        placeholder="mots-cles (ex: rapport 2026)"
        autofocus
        style="flex:2;min-width:200px;"
        onkeydown="if(event.key==='Enter') fsDoSearch()"
      >
      <input
        class="qm-input"
        id="fs-directory"
        type="text"
        placeholder="Repertoire (optionnel si memorise)"
        style="flex:2;min-width:200px;"
        onkeydown="if(event.key==='Enter') fsDoSearch()"
      >
      <input
        class="qm-input"
        id="fs-memkey"
        type="text"
        value="search_dir"
        placeholder="Cle memoire"
        style="flex:1;min-width:120px;"
      >
      <button
        class="qm-submit"
        style="background:var(--accent);"
        onclick="fsDoSearch()">
        &#x1F50D; Chercher
      </button>
    </div>
    <div style="color:var(--text-dim);font-size:0.78rem;padding:4px 0;">
      &#x1F4A1; Memorise un dossier :
      <code style="background:var(--border);padding:1px 6px;border-radius:3px;">
        remember path search_dir=C:\ton\dossier
      </code>
    </div>
  </div>

  <div id="fs-results"></div>
</div>

<style>
.fs-result-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;background:color-mix(in srgb,var(--border) 40%,transparent);margin-bottom:4px;font-size:0.83rem;transition:background 0.15s;}
.fs-result-item:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);}
.fs-icon{font-size:1rem;flex-shrink:0;}
.fs-name{flex:1;color:var(--text);word-break:break-all;}
.fs-open-btn{background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:0.78rem;white-space:nowrap;flex-shrink:0;}
.fs-open-btn:hover{background:var(--accent);color:white;}
</style>

<script>
// fsDoSearch est defini ici ET expose sur window pour etre accessible
// Note : ce script s execute via htmx.process() appele dans loadSection()
window.fsDoSearch = function() {
  var keywords  = document.getElementById("fs-keywords")  ? document.getElementById("fs-keywords").value.trim()  : "";
  var directory = document.getElementById("fs-directory") ? document.getElementById("fs-directory").value.trim() : "";
  var memkey    = document.getElementById("fs-memkey")    ? document.getElementById("fs-memkey").value.trim()    : "search_dir";
  var resultsDiv = document.getElementById("fs-results");

  if (!keywords) {
    if (resultsDiv) resultsDiv.innerHTML = '<div style="color:var(--red);padding:8px;">Veuillez entrer des mots-cles.</div>';
    return;
  }

  if (resultsDiv) resultsDiv.innerHTML = '<div style="color:var(--text-dim);padding:12px;text-align:center;">&#x1F50D; Recherche en cours...</div>';

  var payload = { keywords: keywords, memory_key: memkey || "search_dir" };
  if (directory) payload.directory = directory;

  fetch("/fs/search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
  .then(function(r) { return r.text(); })
  .then(function(html) {
    var rd = document.getElementById("fs-results");
    if (rd) rd.innerHTML = html;
  })
  .catch(function(err) {
    var rd = document.getElementById("fs-results");
    if (rd) rd.innerHTML = '<div style="color:var(--red);">Erreur: ' + err + '</div>';
  });
};

// openFile expose sur window pour les boutons dans les resultats
window.openFile = function(path, btnEl) {
  fetch("/fs/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: path }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.ok) {
      if (btnEl) { btnEl.textContent = "OK Ouvert"; btnEl.style.background = "var(--green)"; btnEl.style.color = "white"; }
      setTimeout(function() {
        if (btnEl) { btnEl.textContent = "&#x2197; Ouvrir"; btnEl.style.background = ""; btnEl.style.color = ""; }
      }, 2000);
    } else {
      if (btnEl) { btnEl.textContent = "Erreur"; btnEl.style.background = "var(--red)"; btnEl.style.color = "white"; }
    }
  });
};
</script>
