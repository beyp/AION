<div class="card">
  <div class="card-title">&#x1F50D; Recherche Fichiers</div>

  <div style="margin-bottom:16px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <input
        class="qm-input"
        id="fs-keywords"
        type="text"
        placeholder="mots-cles (ex: rapport 2026)"
        autofocus
        style="flex:2;min-width:200px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault();window.fsDoSearch();}"
      >
      <input
        class="qm-input"
        id="fs-directory"
        type="text"
        placeholder="Repertoire (optionnel si memorise)"
        style="flex:2;min-width:200px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault();window.fsDoSearch();}"
      >
      <input
        class="qm-input"
        id="fs-memkey"
        type="text"
        value="search_dir"
        placeholder="Cle memoire"
        list="fs-path-keys"
        style="flex:1;min-width:120px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault();window.fsDoSearch();}"
      >
      <datalist id="fs-path-keys">
        <!-- Rempli dynamiquement par loadFsPathKeys() -->
      </datalist>
      <button
        class="qm-submit"
        style="background:var(--accent);"
        onclick="window.fsDoSearch()">
        &#x1F50D; Chercher
      </button>
    </div>
    <div style="color:var(--text-dim);font-size:0.78rem;padding:4px 0;">
      &#x1F4A1; Memorise un dossier :
      <code style="background:var(--border);padding:1px 6px;border-radius:3px;">
        remember path search_dir=C:\ton\dossier
      </code>
    </div>
  </div>

  <div id="fs-results"></div>
</div>

<style>
.fs-result-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;
  background:color-mix(in srgb,var(--border) 40%,transparent);margin-bottom:4px;font-size:0.83rem;}
.fs-result-item:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);}
.fs-icon{font-size:1rem;flex-shrink:0;}
.fs-name{flex:1;color:var(--text);word-break:break-all;}
.fs-open-btn{background:color-mix(in srgb,var(--accent) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  color:var(--accent);padding:3px 10px;border-radius:4px;cursor:pointer;
  font-size:0.78rem;white-space:nowrap;flex-shrink:0;}
.fs-open-btn:hover{background:var(--accent);color:white;}
</style>

<script>
// ── Recherche ─────────────────────────────────────────────────────────────────
// Charger les cles path memoire pour le datalist
window.loadFsPathKeys = function() {
  fetch("/api/memory/paths")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var dl = document.getElementById("fs-path-keys");
      if (!dl) return;
      dl.innerHTML = "";
      data.forEach(function(item) {
        var opt = document.createElement("option");
        opt.value = item.key;
        opt.label = item.value;
        dl.appendChild(opt);
      });
      // Si une seule cle path, la mettre par defaut
      if (data.length === 1) {
        var inp = document.getElementById("fs-memkey");
        if (inp && inp.value === "search_dir") inp.value = data[0].key;
      }
    })
    .catch(function() {});
};
// Charger au demarrage de la section
window.loadFsPathKeys();

window.fsDoSearch = function() {
  var keywords   = (document.getElementById("fs-keywords")  || {}).value || "";
  var directory  = (document.getElementById("fs-directory") || {}).value || "";
  var memkey     = (document.getElementById("fs-memkey")    || {}).value || "search_dir";
  var resultsDiv = document.getElementById("fs-results");

  keywords = keywords.trim();
  if (!keywords) {
    if (resultsDiv) resultsDiv.innerHTML = '<div style="color:var(--red);padding:8px;">Veuillez entrer des mots-cles.</div>';
    return;
  }

  if (resultsDiv) resultsDiv.innerHTML = '<div style="color:var(--text-dim);padding:12px;text-align:center;">Recherche en cours...</div>';

  var payload = { keywords: keywords, memory_key: memkey || "search_dir" };
  if (directory.trim()) payload.directory = directory.trim();

  fetch("/fs/search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
  .then(function(r) { return r.text(); })
  .then(function(html) {
    var rd = document.getElementById("fs-results");
    if (rd) rd.innerHTML = html;
  })
  .catch(function(err) {
    var rd = document.getElementById("fs-results");
    if (rd) rd.innerHTML = '<div style="color:var(--red);">Erreur: ' + err + '</div>';
  });
};

// ── Ouvrir fichier (os.startfile via /fs/open) ────────────────────────────────
window.fsOpenFile = function(btn) {
  var path = btn.getAttribute("data-path");
  if (!path) return;

  var original = btn.textContent;
  btn.textContent = "...";
  btn.disabled = true;

  fetch("/fs/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: path }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.ok) {
      btn.textContent = "OK !";
      btn.style.background = "var(--green)";
      btn.style.color = "white";
    } else {
      btn.textContent = "Erreur";
      btn.title = data.error || "";
      btn.style.background = "var(--red)";
      btn.style.color = "white";
    }
    btn.disabled = false;
    setTimeout(function() {
      btn.textContent = original;
      btn.style.background = "";
      btn.style.color = "";
    }, 2000);
  })
  .catch(function(err) {
    btn.textContent = "Erreur";
    btn.style.background = "var(--red)";
    btn.style.color = "white";
    btn.disabled = false;
  });
};

// ── Editer fichier texte (affichage dans onglet navigateur) ───────────────────
window.fsEditFile = function(btn) {
  var path = btn.getAttribute("data-path");
  if (!path) return;
  // Ouvrir dans un nouvel onglet via /fs/view?path=...
  var url = "/fs/view?path=" + encodeURIComponent(path);
  window.open(url, "_blank");
};
</script>
