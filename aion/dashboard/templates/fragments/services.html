<h2>⚡ Services ({{ service_count }})
    <button class="refresh-btn"
            hx-get="/dashboard/services"
            hx-target="closest .card"
            hx-swap="innerHTML">↻</button>
</h2>
<ul class="service-list">
{% for s in services %}
    <li>
        <div>
            <div class="service-name">{{ s.name }}</div>
            <div class="service-desc">{{ s.description }}</div>
        </div>
        <button class="run-btn"
                hx-post="/run/{{ s.name }}"
                hx-target="#result-{{ s.name }}"
                hx-swap="innerHTML">
            ▶ Run
        </button>
    </li>
    <div id="result-{{ s.name }}"></div>
{% else %}
    <li style="color:#555;">Aucun service disponible.</li>
{% endfor %}
</ul>
