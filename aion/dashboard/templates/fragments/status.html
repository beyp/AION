<h2>📊 Statut
    <button class="refresh-btn"
            hx-get="/dashboard/status"
            hx-target="closest .card"
            hx-swap="innerHTML">↻</button>
</h2>
<div class="stat-row">
    <span class="stat-label">Version</span>
    <span class="stat-value">{{ version }}</span>
</div>
<div class="stat-row">
    <span class="stat-label">Services</span>
    <span class="stat-value">{{ service_count }}</span>
</div>
<div class="stat-row">
    <span class="stat-label">Memoire persistante</span>
    <span class="stat-value">{{ memory_stats.total }} items</span>
</div>
<div class="stat-row">
    <span class="stat-label">Scheduler</span>
    <span class="stat-value">
        {% if scheduler_running %}
            <span class="badge badge-green">▶ Running</span>
        {% else %}
            <span class="badge badge-red">⏹ Stopped</span>
        {% endif %}
    </span>
</div>
<div class="stat-row">
    <span class="stat-label">Jobs planifies</span>
    <span class="stat-value">{{ job_count }}</span>
</div>
<div class="stat-row">
    <span class="stat-label">API REST</span>
    <span class="stat-value">
        <a href="http://127.0.0.1:8000/docs" target="_blank"
           style="color:#1e90ff; text-decoration:none;">
            Swagger Docs ↗
        </a>
    </span>
</div>
