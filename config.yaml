app:
  name: AION
  version: "0.7.0"
  environment: local

logging:
  file: logs/aion.log
  level: INFO

security:
  require_confirmation_for_unknown_commands: true
  allow_shell_execution: false

api:
  host: 127.0.0.1
  port: 8000
  enabled: true

scheduler:
  timezone: America/Toronto
  enabled: true

notifications:
  enabled: true
  duration_seconds: 5

ai:
  ollama_url: http://localhost:11434
  model: mistral:latest
  timeout: 300
